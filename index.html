<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Mami Lechera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:
linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.35)),
url("modelo.png") center/cover no-repeat fixed;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}
.card{
width:min(390px,92vw);
background:#fff;
border-radius:32px;
padding:30px;
text-align:center;
box-shadow:0 25px 60px rgba(0,0,0,.35);
animation:float 4s ease-in-out infinite;
position:relative;
z-index:2;
}
@keyframes float{50%{transform:translateY(-8px)}}
.logo{
font-size:44px;
font-weight:900;
line-height:1.05;
color:#ff2c82;
text-shadow:
0 2px #fff,
0 4px #ff9bc8,
0 6px #ff7ab8,
0 10px 14px rgba(255,45,130,.35);
margin-bottom:16px;
}
.sub{color:#666;margin-bottom:22px}
#btn{
height:88px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#ff78ba,#ff2c82);
color:#fff;
font-size:32px;
font-weight:900;
cursor:pointer;
position:relative;
overflow:hidden;
box-shadow:0 12px 28px rgba(255,45,130,.35);
}
#btn:before{
content:"";
position:absolute;
left:-60%;
top:0;
width:45%;
height:100%;
background:rgba(255,255,255,.35);
transform:skewX(-20deg);
animation:shine 2.6s infinite;
}
@keyframes shine{100%{left:140%}}
#premio{
display:none;
font-size:92px;
font-weight:900;
color:#ff2c82;
text-shadow:0 0 18px rgba(255,45,130,.35);
animation:pop .45s ease;
}
@keyframes pop{
0%{transform:scale(.2) rotate(-8deg);opacity:0}
80%{transform:scale(1.15)}
100%{transform:scale(1)}
}
#msg{display:none;margin-top:14px;color:#ff2c82;font-weight:bold}
.confetti{
position:fixed;
width:10px;height:10px;border-radius:50%;
animation:fall 2.2s linear forwards;
}
@keyframes fall{
to{transform:translateY(110vh) rotate(720deg);opacity:0}
}
.heart{
position:fixed;
bottom:-30px;
font-size:22px;
animation:rise 8s linear infinite;
opacity:.5;
}
@keyframes rise{
to{transform:translateY(-120vh);opacity:0}
}
</style>
</head>
<body>

<div class="card">
<div class="logo">🍼 LA MAMI<br>LECHERA 🍼</div>
<div class="sub">Pulsa para descubrir tu premio.</div>

<div id="btn">RASCA Y GANA</div>

<div id="premio"></div>
<div id="msg">💖 ¡Gracias por participar! 💖</div>
</div>

<script>
const premios=[4,7,12,17];
const btn=document.getElementById("btn");
const premio=document.getElementById("premio");
const msg=document.getElementById("msg");
let usado=false;

for(let i=0;i<20;i++){
 const h=document.createElement("div");
 h.className="heart";
 h.innerHTML="💗";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDelay=Math.random()*8+"s";
 document.body.appendChild(h);
}

function confeti(){
const colores=["#ff2c82","#ffd700","#8de6ff","#ffffff"];
for(let i=0;i<90;i++){
const c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.top="-15px";
c.style.background=colores[Math.floor(Math.random()*colores.length)];
document.body.appendChild(c);
setTimeout(()=>c.remove(),2300);
}
}

btn.onclick=()=>{
 if(usado)return;
 usado=true;
 btn.style.display="none";
 premio.style.display="block";
 msg.style.display="block";
 premio.textContent=premios[Math.floor(Math.random()*premios.length)];
 confeti();
};
</script>
</body>
</html>
