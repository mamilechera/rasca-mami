<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA MAMI LECHERA</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#ff5fa2,#ff2d7a);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:340px;
    background:#fff;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.3);
}

h1{
    color:#ff2d7a;
    margin-bottom:10px;
}

p{
    color:#555;
}

#scratch{
    margin:25px auto;
    width:240px;
    height:100px;
    background:#bdbdbd;
    color:white;
    font-size:32px;
    font-weight:bold;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.3s;
}

#scratch:hover{
    background:#9e9e9e;
}

#numero{
    font-size:70px;
    font-weight:bold;
    color:#ff2d7a;
    display:none;
    animation:zoom .5s;
}

@keyframes zoom{
    from{transform:scale(.2);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

button{
    margin-top:25px;
    padding:14px 28px;
    border:none;
    background:#ff2d7a;
    color:white;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#e80062;
}
</style>

</head>
<body>

<div class="card">

<h1>🎀 LA MAMI LECHERA 🎀</h1>

<p>Pulsa sobre la tarjeta para descubrir tu premio.</p>

<div id="scratch">RASCAR</div>

<div id="numero"></div>

<button onclick="jugar()">JUGAR OTRA VEZ</button>

</div>

<script>

const premios=[4,7,12,17];

function jugar(){

const numero=premios[Math.floor(Math.random()*premios.length)];

document.getElementById("scratch").style.display="none";

const n=document.getElementById("numero");

n.innerHTML=numero;

n.style.display="block";

}

document.getElementById("scratch").onclick=jugar;

</script>

</body>
</html>
