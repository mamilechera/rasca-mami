<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LA MAMI LECHERA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.35)),url('modelo.png') center/cover no-repeat fixed;display:flex;justify-content:center;align-items:center;height:100vh}
.card{width:370px;background:#fff;border-radius:30px;padding:30px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.45);animation:f 4s ease-in-out infinite}
@keyframes f{50%{transform:translateY(-10px)}}
.titulo{font-size:42px;font-weight:900;color:#ff2d7a;text-shadow:0 2px 0 #fff,0 4px 0 #ff9ac6,0 8px 14px rgba(255,45,122,.45);margin:0 0 15px}
p{color:#666}
#scratch{margin:25px auto;width:250px;height:88px;border-radius:18px;background:linear-gradient(135deg,#ff5aa8,#ff197a);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:900;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 10px 25px rgba(255,45,122,.45)}
#scratch:before{content:"";position:absolute;left:-120%;top:0;width:60%;height:100%;background:rgba(255,255,255,.35);transform:skewX(-20deg);animation:s 2.8s infinite}
@keyframes s{100%{left:160%}}
#numero{display:none;font-size:90px;color:#ff2d7a;font-weight:900}
#gracias{display:none;margin-top:16px;color:#ff2d7a;font-weight:bold}
.c{position:fixed;width:10px;height:10px;border-radius:50%;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style></head><body>
<div class="card">
<h1 class="titulo">🍼 LA MAMI LECHERA 🍼</h1>
<p>Pulsa para descubrir tu premio.</p>
<div id="scratch">RASCA Y GANA</div>
<div id="numero"></div>
<div id="gracias">💖 Gracias por participar 💖</div>
</div>
<script>
const premios=[4,7,12,17];let usado=false;
const scratch=document.getElementById('scratch'),numero=document.getElementById('numero'),gracias=document.getElementById('gracias');
function confeti(){const cols=['#ff2d7a','#ffd700','#7de3ff','#fff'];for(let i=0;i<70;i++){let d=document.createElement('div');d.className='c';d.style.left=Math.random()*100+'vw';d.style.top='-10px';d.style.background=cols[Math.floor(Math.random()*cols.length)];document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}}
scratch.addEventListener('click',()=>{if(usado)return;usado=true;scratch.style.display='none';numero.style.display='block';gracias.style.display='block';numero.textContent=premios[Math.floor(Math.random()*premios.length)];confeti();});
</script></body></html>
